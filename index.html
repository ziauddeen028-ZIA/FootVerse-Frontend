<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Metadata -->
    <title>FootVerse — Football Tournament Platform</title>
    <meta name="title" content="FootVerse — Modern Football Tournament & Match Center Platform" />
    <meta name="description" content="Live scores, match schedules, automated knockout & league brackets, team rosters, and real-time player statistics on FootVerse." />
    <meta name="keywords" content="football tournaments, live soccer scores, match fixtures, knockout brackets, tournament organizer, football stats, soccer leagues" />
    <meta name="author" content="FootVerse Arena" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://footverse.app/" />

    <!-- Theme & App Identity -->
    <meta name="theme-color" content="#16A34A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07130C" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="FootVerse" />
    <meta name="apple-mobile-web-app-title" content="FootVerse" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://footverse.app/" />
    <meta property="og:site_name" content="FootVerse" />
    <meta property="og:title" content="FootVerse — Where Every Match Becomes a Story" />
    <meta property="og:description" content="Live scores, match updates, tournaments, teams, and player stats — all in one modern football SaaS platform." />
    <meta property="og:image" content="/hero_artwork.webp" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://footverse.app/" />
    <meta name="twitter:title" content="FootVerse — Modern Football Tournament & Match Center Platform" />
    <meta name="twitter:description" content="Live scores, match updates, tournaments, teams, and player stats — all in one modern football SaaS platform." />
    <meta name="twitter:image" content="/hero_artwork.webp" />

    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('footverse_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#07130C] dark:text-slate-100 font-sans antialiased selection:bg-green-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
